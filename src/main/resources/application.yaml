spring:
  application:
    name: aiplayground
  docker:
    compose:
      lifecycle-management: start_only
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  webflux:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  codec:
    max-in-memory-size: 256MB

app:
  user:
    accounts:
      user01: "{noop}pass01"
      user02: "{noop}pass02"
      user03: "{noop}pass03"
    permissions:
      CREATE_RAG:
        - user01
        - user02
      DELETE_RAG:
        - user03
      # Roles listed here are granted to ALL users.
      # If a role appears here, its entry in the permissions map above is ignored.
      all: []
  github:
    token: ${GITHUB_TOKEN}
    clone-dir: /tmp/github-clones
  confluence:
    base-url: ${CONFLUENCE_BASE_URL:}
    email: ${CONFLUENCE_EMAIL:}
    api-token: ${CONFLUENCE_API_TOKEN:}
  monday:
    api-url: ${MONDAY_API_URL:https://api.monday.com/v2}
    api-token: ${MONDAY_API_TOKEN:}
  s3:
    region: ${AWS_REGION:us-east-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}

# add trace logging for webclient to help debug issues with external API calls
logging:
  level:
    org.springframework.web.reactive.function.client: DEBUG
