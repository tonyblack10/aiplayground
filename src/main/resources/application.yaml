spring:
  application:
    name: aiplayground
  docker:
    compose:
      lifecycle-management: start_only
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
    mcp:
      server:
        name: aiplayground-mcp-server
        version: 1.0.0
        type: ASYNC
        protocol: STATELESS

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      # McpServerStatelessAutoConfiguration is no longer excluded: the Spring AI 1.1.5 bug that
      # required replacing it (missing .jsonMapper(...) call) is fixed upstream as of Spring AI 2.0
      # via McpServerJsonMapperAutoConfiguration. Only the WebFlux transport bean is still
      # overridden (in McpServerConfig), to capture HTTP headers for vector-store selection.
      - org.springframework.ai.mcp.server.common.autoconfigure.StatelessToolCallbackConverterAutoConfiguration
  webflux:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  codec:
    max-in-memory-size: 256MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:}
  rag:
    agentic:
      # Tuning for AgenticRagSearchService's multi-query fan-out/fan-in retrieval,
      # used by the searchRagDocuments MCP tool for complex/multi-part queries.
      enabled: true
      number-of-queries: 3
      complexity-word-threshold: 6
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl: ${REDIS_SSL:false}
      # Each entry is registered as its own vector store (unique 'name'), all sharing
      # the Redis connection above. See:
      # https://docs.spring.io/spring-ai/reference/1.1/api/vectordbs/redis.html#_manual_configuration
      stores:
        - name: redisVectorStore
          display-name: Redis
          index-name: custom-index
          prefix: "custom-prefix:"
          vector-algorithm: HNSW
          initialize-schema: true
  user:
    accounts:
      user01: "{noop}pass01"
      user02: "{noop}pass02"
      user03: "{noop}pass03"
    permissions:
      # RAG_ACCESS_ALL grants unrestricted access to every store.
      # RAG_ACCESS_{SUFFIX} grants access to a specific store.
      # Store suffixes: SIMPLE, PGVECTOR, REDIS.
      RAG_ACCESS_ALL:
        - user01
      RAG_ACCESS_SIMPLE:
        - user02
      RAG_ACCESS_PGVECTOR:
        - user02
      RAG_ACCESS_REDIS:
        - user03
      # Authorities listed here are granted to ALL authenticated users.
      # If an authority appears here, its per-user mapping above is ignored.
      all: []
  jwt:
    secret: ${JWT_SECRET:aiplayground-dev-secret-key-must-be-at-least-32-bytes!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:aiplayground}
  github:
    token: ${GITHUB_TOKEN}
    clone-dir: /tmp/github-clones
    webhooks:
      # Example: monitor the docs/ folder of a repo on the main branch.
      # GitHub webhook URL to register: https://<your-host>/webhooks/github
      # Content type: application/json  |  Events: Push, Pull request
       - repo-url: https://github.com/tonyblack10/documentations
         directory:
         branch: main
         store-id: redisVectorStore
         secret: ${GITHUB_WEBHOOK_SECRET:}
  confluence:
    base-url: ${CONFLUENCE_BASE_URL:}
    email: ${CONFLUENCE_EMAIL:}
    api-token: ${CONFLUENCE_API_TOKEN:}
  monday:
    api-url: ${MONDAY_API_URL:https://api.monday.com/v2}
    api-token: ${MONDAY_API_TOKEN:}
  s3:
    region: ${AWS_REGION:us-east-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}
    records-bucket: ${AWS_S3_RECORDS_BUCKET:}
    # Base folder for import records; each vector store gets its own subfolder,
    # e.g. records/<vectorstore_name>/<record-id>.json
    records-prefix: ${AWS_S3_RECORDS_PREFIX:records}

# add trace logging for webclient to help debug issues with external API calls
logging:
  level:
    org.springframework.web.reactive.function.client: DEBUG
