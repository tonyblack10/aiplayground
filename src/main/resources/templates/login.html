<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Spring AI Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fade-in 0.3s ease-out both; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

  <div class="fade-in w-full max-w-sm">

    <!-- Logo / brand -->
    <div class="flex flex-col items-center mb-8 gap-3">
      <div class="bg-slate-800 rounded-2xl p-4 shadow-lg ring-1 ring-slate-700">
        <svg class="w-9 h-9 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
      </div>
      <div class="text-center">
        <h1 class="text-white font-bold text-xl tracking-tight">Spring AI Playground</h1>
        <p class="text-slate-400 text-sm mt-1">Sign in to continue</p>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl ring-1 ring-slate-200 px-8 py-8">

      <!-- Error banner -->
      <div th:if="${param.error}"
           class="mb-5 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Invalid username or password.</span>
      </div>

      <!-- Logout success banner -->
      <div th:if="${param.logout}"
           class="mb-5 flex items-center gap-2 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 13l4 4L19 7"/>
        </svg>
        <span>You have been signed out successfully.</span>
      </div>

      <!-- Login form -->
      <form th:action="@{/login}" method="post" class="space-y-5">

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <input id="username" name="username" type="text"
                 autocomplete="username" autofocus required
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900
                        placeholder:text-slate-400 shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                        transition-colors duration-150"
                 placeholder="Enter your username"/>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900
                        placeholder:text-slate-400 shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                        transition-colors duration-150"
                 placeholder="Enter your password"/>
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full flex items-center justify-center gap-2 rounded-lg
                       bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                       text-white font-semibold text-sm px-4 py-2.5
                       shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Sign in
        </button>

      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6 font-mono">Spring AI v1.1.3</p>
  </div>

</body>
</html>
