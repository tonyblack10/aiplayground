<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="searchResults">

  <div class="flex items-center justify-between mb-4">
    <h4 class="text-sm font-semibold text-gray-700">
      Resultados para: <em class="text-blue-600 not-italic" th:text="${query}">query</em>
    </h4>
    <span class="text-xs text-gray-400" th:text="${searchResults.size()} + ' resultado(s)'">0 resultados</span>
  </div>

  <!-- Empty state -->
  <div th:if="${searchResults.isEmpty()}" class="text-center py-10 text-gray-400 text-sm bg-white rounded-xl border border-gray-100">
    Nenhum resultado encontrado para "<span th:text="${query}">query</span>".
    Tente palavras-chave diferentes.
  </div>

  <!-- Result cards -->
  <div class="space-y-3">
    <div th:each="doc, stat : ${searchResults}"
         class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 hover:shadow-md transition-shadow">
      <div class="flex items-start justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full"
                th:text="'#' + ${stat.index + 1}">
            #1
          </span>
          <span class="text-xs text-gray-500 font-medium"
                th:text="${doc.metadata['source'] ?: doc.metadata['filename'] ?: 'documento'}">
            fonte
          </span>
        </div>
        <span class="text-xs text-gray-400 font-mono" th:text="${#strings.abbreviate(doc.id, 12)}">id...</span>
      </div>
      <p class="text-sm text-gray-700 leading-relaxed"
         th:text="${#strings.abbreviate(doc.getText(), 400)}">
        Conteúdo do documento...
      </p>
    </div>
  </div>

</div>

</body>
</html>
