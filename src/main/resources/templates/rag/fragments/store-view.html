<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="storeView" class="h-full w-full flex flex-col">

  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <h2 class="text-xl font-semibold text-gray-800" th:text="${storeId}">Store Name</h2>
  </div>

  <!-- Tab navigation -->
  <style>
    .tab-btn { border-bottom: 2px solid transparent; color: #6b7280; }
    .tab-btn:hover { color: #374151; border-bottom-color: #d1d5db; }
    .tab-btn.tab-active { border-bottom-color: #3b82f6; color: #2563eb; }
    .tab-btn.tab-active:hover { border-bottom-color: #3b82f6; color: #2563eb; }
  </style>
  <div class="bg-white border-b border-gray-200 px-6">
    <nav class="flex space-x-0" id="tab-nav">
      <button id="tab-add"
              class="tab-btn tab-active px-4 py-3 text-sm font-medium -mb-px"
              th:hx-get="@{/rag/{s}/add(s=${storeId})}"
              hx-target="#tab-content"
              hx-swap="innerHTML"
              onclick="activateTab('tab-add')">
        Adicionar
      </button>
      <button id="tab-search"
              class="tab-btn px-4 py-3 text-sm font-medium -mb-px"
              th:hx-get="@{/rag/{s}/search(s=${storeId})}"
              hx-target="#tab-content"
              hx-swap="innerHTML"
              onclick="activateTab('tab-search')">
        Buscar
      </button>
    </nav>
  </div>

  <!-- Tab content area: loads Adicionar tab automatically on store selection -->
  <div id="tab-content" class="flex-1 overflow-auto px-6 py-4"
       th:hx-get="@{/rag/{s}/add(s=${storeId})}"
       hx-trigger="load"
       hx-swap="innerHTML">
    <div class="text-center py-8 text-gray-400 text-sm">Carregando...</div>
  </div>

  <script>
    function activateTab(activeId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('tab-active', btn.id === activeId);
      });
    }
  </script>

</div>

</body>
</html>
