<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="storeView" class="h-full w-full flex flex-col">

  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <h2 class="text-xl font-semibold text-gray-800" th:text="${storeId}">Store Name</h2>
  </div>

  <!-- Tab navigation -->
  <div class="bg-white border-b border-gray-200 px-6">
    <nav class="flex space-x-0" id="tab-nav">
      <button id="tab-documents"
              class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-600 -mb-px"
              th:hx-get="@{/rag/{s}/documents(s=${storeId})}"
              hx-target="#tab-content"
              hx-swap="innerHTML"
              onclick="activateTab('tab-documents')">
        Documentos
      </button>
      <button id="tab-add"
              class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 -mb-px"
              th:hx-get="@{/rag/{s}/add(s=${storeId})}"
              hx-target="#tab-content"
              hx-swap="innerHTML"
              onclick="activateTab('tab-add')">
        Adicionar
      </button>
      <button id="tab-search"
              class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 -mb-px"
              th:hx-get="@{/rag/{s}/search(s=${storeId})}"
              hx-target="#tab-content"
              hx-swap="innerHTML"
              onclick="activateTab('tab-search')">
        Buscar
      </button>
    </nav>
  </div>

  <!-- Tab content area -->
  <div id="tab-content" class="flex-1 overflow-auto px-6 py-4">
    <div th:replace="~{rag/fragments/document-list :: documentList}"></div>
  </div>

</div>

<script>
  function activateTab(activeId) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      if (btn.id === activeId) {
        btn.classList.add('border-blue-500', 'text-blue-600');
        btn.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
      } else {
        btn.classList.remove('border-blue-500', 'text-blue-600');
        btn.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
      }
    });
  }
</script>

</body>
</html>
