<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="s3ImportFeedback">

  <!-- Error (no result at all) -->
  <div th:if="${errorMessage}"
       class="flex items-start gap-2 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
    <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span th:text="${errorMessage}"></span>
  </div>

  <!-- Result summary -->
  <div th:if="${s3Result}" class="space-y-3">

    <!-- Stats row -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-center">
        <p class="text-2xl font-bold text-gray-800" th:text="${s3Result.filesProcessed()}">0</p>
        <p class="text-xs text-gray-500 mt-0.5">Arquivos encontrados</p>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-lg px-4 py-3 text-center">
        <p class="text-2xl font-bold text-green-700" th:text="${s3Result.filesIngested()}">0</p>
        <p class="text-xs text-green-600 mt-0.5">Arquivos ingeridos</p>
      </div>
      <div class="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 text-center">
        <p class="text-2xl font-bold text-blue-700" th:text="${s3Result.chunksIngested()}">0</p>
        <p class="text-xs text-blue-600 mt-0.5">Chunks adicionados</p>
      </div>
    </div>

    <!-- All success banner -->
    <div th:if="${s3Result.errors().isEmpty()}"
         class="flex items-center gap-2 px-4 py-3 rounded-lg bg-green-50 border border-green-200 text-sm text-green-700">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>Importação concluída com sucesso.</span>
    </div>

    <!-- Partial success + errors -->
    <div th:unless="${s3Result.errors().isEmpty()}" class="space-y-2">
      <div th:if="${s3Result.filesIngested() > 0}"
           class="flex items-center gap-2 px-4 py-3 rounded-lg bg-yellow-50 border border-yellow-200 text-sm text-yellow-700">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>Importação parcialmente concluída.</span>
      </div>

      <details class="rounded-lg border border-red-200 bg-red-50 overflow-hidden">
        <summary class="flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-red-700 cursor-pointer select-none">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span th:text="${s3Result.errors().size()} + ' erro(s) encontrado(s)'"></span>
        </summary>
        <ul class="px-4 pb-3 pt-1 space-y-1">
          <li th:each="err : ${s3Result.errors()}"
              class="text-xs text-red-600 font-mono" th:text="${err}"></li>
        </ul>
      </details>
    </div>

  </div>
</div>

</body>
</html>
