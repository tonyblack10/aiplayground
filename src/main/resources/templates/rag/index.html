<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Management – Spring AI Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden font-sans">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
    <div class="px-5 py-4 border-b border-slate-700">
      <h1 class="text-lg font-bold tracking-tight">Spring AI Playground</h1>
      <p class="text-xs text-slate-400 mt-0.5">RAG Management</p>
    </div>

    <!-- Navigation -->
    <div class="px-3 py-3 border-b border-slate-700">
      <p class="text-xs text-slate-500 uppercase tracking-wider px-2 mb-2">Navigation</p>
      <a href="/rag"
         class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm bg-slate-700 text-white border-l-2 border-blue-400 mb-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        RAG Management
      </a>
      <a href="/chat"
         class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors duration-150 mb-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        Chat
      </a>
    </div>

    <nav class="flex-1 overflow-y-auto py-3 px-2">
      <p class="text-xs text-slate-500 uppercase tracking-wider px-3 mb-2">Vector Stores</p>
      <ul>
        <li th:each="store : ${storeInfos}">
          <button
              class="w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center justify-between
                     hover:bg-slate-700 transition-colors duration-150 mb-0.5"
              th:classappend="${store.primary} ? ' border-l-2 border-blue-400' : ''"
              th:hx-get="@{/rag/{s}/view(s=${store.id})}"
              hx-target="#main-content"
              hx-swap="innerHTML"
              hx-push-url="false">
            <span class="flex items-center gap-2">
              <span th:if="${store.type == 'SIMPLE'}" class="text-green-400">●</span>
              <span th:if="${store.type == 'PGVECTOR'}" class="text-blue-400">●</span>
              <span th:if="${store.type == 'REDIS'}" class="text-red-400">●</span>
              <span th:text="${store.displayName}">Store</span>
            </span>
            <span class="text-xs bg-slate-700 rounded-full px-2 py-0.5" th:text="${store.documentCount}">0</span>
          </button>
        </li>
      </ul>
    </nav>
    <div class="px-4 py-3 border-t border-slate-700 text-xs text-slate-500">
      Spring AI v1.1.3
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    <div id="main-content" class="h-full flex items-center justify-center">
      <div class="text-center text-gray-400">
        <svg class="mx-auto mb-4 w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <p class="text-sm">Selecione um vector store para começar</p>
      </div>
    </div>
  </main>

</body>
</html>
