<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Management – Spring AI Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <th:block th:replace="~{fragments/htmx-config :: htmxConfig}"></th:block>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar('rag')}"></div>

  <!-- Body: sidebar + main -->
  <div class="flex flex-1 overflow-hidden">

  <!-- Sidebar (vector stores) -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
    <div class="px-5 py-4 border-b border-slate-700">
      <h1 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Vector Stores</h1>
    </div>

    <nav class="flex-1 overflow-y-auto py-3 px-2">
      <ul>
        <li th:each="store : ${storeInfos}">
          <button
              class="w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center justify-between
                     hover:bg-slate-700 transition-colors duration-150 mb-0.5"
              th:classappend="${store.primary} ? ' border-l-2 border-blue-400' : ''"
              th:hx-get="@{/rag/{s}/view(s=${store.id})}"
              hx-target="#main-content"
              hx-swap="innerHTML"
              hx-push-url="false">
            <span class="flex items-center gap-2">
              <span th:if="${store.type == 'SIMPLE'}" class="text-green-400">●</span>
              <span th:if="${store.type == 'PGVECTOR'}" class="text-blue-400">●</span>
              <span th:if="${store.type == 'REDIS'}" class="text-red-400">●</span>
              <span th:text="${store.displayName}">Store</span>
            </span>
            <span class="text-xs bg-slate-700 rounded-full px-2 py-0.5" th:text="${store.documentCount}">0</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    <div id="main-content" class="h-full flex items-center justify-center">
      <div class="text-center text-gray-400">
        <svg class="mx-auto mb-4 w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <p class="text-sm">Selecione um vector store para começar</p>
      </div>
    </div>
  </main>

  </div><!-- end flex body -->

</body>
</html>
