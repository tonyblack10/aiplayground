<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<nav th:fragment="navbar(activePage)" class="bg-slate-900 shadow-sm flex-shrink-0">
  <div class="mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">

      <!-- Brand -->
      <div class="flex items-center gap-3">
        <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span class="text-white font-bold text-base tracking-tight">Spring AI Playground</span>
      </div>

      <!-- Nav links -->
      <div class="flex items-center space-x-1">
        <a href="/chat"
           th:classappend="${activePage == 'chat'} ? ' bg-slate-700 text-white' : ' text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium transition-colors duration-150">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          Chat
        </a>
        <a href="/rag"
           th:classappend="${activePage == 'rag'} ? ' bg-slate-700 text-white' : ' text-slate-300 hover:bg-slate-700 hover:text-white'"
           class="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium transition-colors duration-150">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          RAG Management
        </a>
      </div>

      <!-- Version badge -->
      <span class="text-xs text-slate-500 font-mono">Spring AI v1.1.3</span>

    </div>
  </div>
</nav>

</body>
</html>
