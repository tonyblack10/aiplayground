<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat – Spring AI Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }

    #messages { scroll-behavior: smooth; }

    textarea { resize: none; }
    textarea:focus { outline: none; }
  </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar('chat')}"></div>

  <!-- Body: sidebar + main -->
  <div class="flex flex-1 overflow-hidden">

  <!-- Sidebar (settings only) -->
  <aside class="w-72 bg-slate-900 text-white flex flex-col flex-shrink-0 overflow-y-auto">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-700">
      <h1 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Chat Settings</h1>
    </div>

    <!-- Settings controls (included in message form via hx-include) -->
    <div id="sidebar-settings" class="flex-1 px-4 py-4 space-y-5">

      <!-- Provider -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Provider</label>
        <select name="provider" id="ctrl-provider"
                class="w-full bg-slate-800 border border-slate-600 text-white text-sm rounded-lg px-3 py-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                hx-get="/chat/models"
                hx-trigger="change"
                hx-target="#ctrl-model"
                hx-swap="innerHTML"
                hx-include="this">
          <option th:each="p : ${providers}"
                  th:value="${p.id}"
                  th:text="${p.displayName}"
                  th:selected="${settings.provider == p.id}">Provider</option>
        </select>
      </div>

      <!-- Model -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Model</label>
        <select name="model" id="ctrl-model"
                class="w-full bg-slate-800 border border-slate-600 text-white text-sm rounded-lg px-3 py-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
          <th:block th:each="p : ${providers}" th:if="${settings.provider == p.id}">
            <option th:each="m : ${p.models}"
                    th:value="${m}"
                    th:text="${m}"
                    th:selected="${settings.model == m}">model</option>
          </th:block>
        </select>
      </div>

      <!-- Temperature -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Temperature</label>
          <span id="temp-display" class="text-xs font-mono text-blue-400"
                th:text="${settings.temperature}">0.7</span>
        </div>
        <input type="range" name="temperature" id="ctrl-temperature"
               min="0" max="2" step="0.1"
               th:value="${settings.temperature}"
               class="w-full h-1.5 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500"
               oninput="document.getElementById('temp-display').textContent = parseFloat(this.value).toFixed(1)"/>
        <div class="flex justify-between text-xs text-slate-600 mt-1">
          <span>Precise</span>
          <span>Creative</span>
        </div>
      </div>

      <!-- RAG Store -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">RAG Context</label>
        <div class="space-y-1.5">

          <!-- None option -->
          <label class="flex items-center gap-2.5 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-800 transition-colors">
            <input type="radio" name="ragStoreId" value="none"
                   th:checked="${!settings.hasRag()}"
                   class="accent-blue-500 flex-shrink-0"/>
            <span class="text-sm text-slate-300">None</span>
          </label>

          <!-- Store options -->
          <label th:each="store : ${storeInfos}"
                 class="flex items-center gap-2.5 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-800 transition-colors">
            <input type="radio" name="ragStoreId"
                   th:value="${store.id}"
                   th:checked="${settings.ragStoreId == store.id}"
                   class="accent-blue-500 flex-shrink-0"/>
            <span class="flex items-center gap-1.5 text-sm text-slate-300">
              <span th:if="${store.type == 'SIMPLE'}" class="text-green-400 text-xs">●</span>
              <span th:if="${store.type == 'PGVECTOR'}" class="text-blue-400 text-xs">●</span>
              <span th:if="${store.type == 'REDIS'}" class="text-red-400 text-xs">●</span>
              <span th:text="${store.displayName}">Store</span>
            </span>
            <span class="ml-auto text-xs bg-slate-700 rounded-full px-2 py-0.5 text-slate-400"
                  th:text="${store.documentCount}">0</span>
          </label>
        </div>
      </div>

      <!-- Tools -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tools</label>
        <div class="space-y-1.5">
          <label th:each="tool : ${availableTools}"
                 class="flex items-start gap-2.5 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-800 transition-colors">
            <input type="checkbox" name="tools"
                   th:value="${tool['id']}"
                   th:checked="${settings.hasTool(tool['id'])}"
                   class="accent-blue-500 mt-0.5 flex-shrink-0"/>
            <div>
              <p class="text-sm text-slate-300" th:text="${tool['name']}">Tool</p>
              <p class="text-xs text-slate-500" th:text="${tool['description']}">desc</p>
            </div>
          </label>
        </div>
      </div>

    </div>

    <!-- Clear chat + footer -->
    <div class="px-4 py-3 border-t border-slate-700 space-y-2">
      <button
          hx-delete="/chat/session"
          hx-target="#messages"
          hx-swap="innerHTML"
          hx-confirm="Clear the conversation?"
          class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-400 border border-slate-700 hover:bg-slate-800 hover:text-white hover:border-slate-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Clear Chat
      </button>
    </div>

  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- Session info bar -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">Provider</span>
        <span class="text-xs font-semibold text-gray-800 bg-gray-100 rounded px-2 py-0.5"
              th:text="${settings.provider}">openai</span>
      </div>
      <span class="text-gray-300">·</span>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">Model</span>
        <span class="text-xs font-semibold text-gray-800 bg-gray-100 rounded px-2 py-0.5"
              th:text="${settings.model}">gpt-4o-mini</span>
      </div>
      <span class="text-gray-300">·</span>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">Temp</span>
        <span class="text-xs font-semibold text-gray-800 bg-gray-100 rounded px-2 py-0.5"
              th:text="${settings.temperature}">0.7</span>
      </div>
      <th:block th:if="${settings.hasRag()}">
        <span class="text-gray-300">·</span>
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-0.5">
            RAG: <span th:text="${settings.ragStoreId}">store</span>
          </span>
        </div>
      </th:block>
      <div class="ml-auto flex items-center gap-1.5" th:if="${!#lists.isEmpty(settings.tools)}">
        <span th:each="tool : ${settings.tools}"
              class="text-xs font-semibold text-purple-700 bg-purple-50 border border-purple-200 rounded px-2 py-0.5"
              th:text="${tool}">tool</span>
      </div>
    </div>

    <!-- Messages area -->
    <div id="messages"
         class="flex-1 overflow-y-auto px-6 py-6 space-y-1">
      <div th:replace="~{chat/fragments/message-list :: messageList}"></div>
    </div>

    <!-- Input area -->
    <div class="bg-white border-t border-gray-200 px-4 py-4 flex-shrink-0">
      <form id="chat-form"
            hx-post="/chat/send"
            hx-target="#messages"
            hx-swap="innerHTML"
            hx-include="#sidebar-settings select, #sidebar-settings input[type='range'], #sidebar-settings input:checked"
            hx-indicator="#send-indicator"
            class="relative flex items-end gap-3 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all">

        <textarea id="msg-input"
                  name="message"
                  rows="1"
                  placeholder="Message AI Playground…"
                  required
                  class="flex-1 bg-transparent text-sm text-gray-800 placeholder-gray-400 border-none outline-none leading-relaxed max-h-40 overflow-y-auto"
                  oninput="autoResize(this)"
                  onkeydown="handleKey(event)"></textarea>

        <div class="flex items-center gap-2 flex-shrink-0">
          <!-- Loading indicator -->
          <span id="send-indicator" class="htmx-indicator">
            <svg class="w-5 h-5 text-blue-500 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
          </span>

          <!-- Send button -->
          <button type="submit"
                  class="w-9 h-9 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white rounded-xl flex items-center justify-center transition-colors flex-shrink-0"
                  id="send-btn">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </div>

      </form>
      <p class="text-xs text-gray-400 text-center mt-2">Press <kbd class="font-mono bg-gray-100 rounded px-1">Ctrl+Enter</kbd> to send</p>
    </div>

  </main>

  </div><!-- end flex body -->

  <script>
    // Auto-resize textarea as user types
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    // Ctrl+Enter to submit
    function handleKey(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById('chat-form').requestSubmit();
      }
    }

    // Scroll messages to bottom
    function scrollToBottom() {
      const messages = document.getElementById('messages');
      if (messages) messages.scrollTop = messages.scrollHeight;
    }

    // Start SSE streaming when a streaming bubble is present
    function startStreaming() {
      const bubble = document.getElementById('streaming-bubble');
      if (!bubble) return;

      const contentEl = bubble.querySelector('.stream-content');
      const cursor = bubble.querySelector('.cursor');
      const sendBtn = document.getElementById('send-btn');
      const msgInput = document.getElementById('msg-input');

      if (sendBtn) sendBtn.disabled = true;
      if (msgInput) msgInput.disabled = true;

      let accumulated = '';
      const evtSource = new EventSource('/chat/stream');

      evtSource.onmessage = function(e) {
        if (e.data === '[DONE]') {
          evtSource.close();
          if (cursor) cursor.remove();
          if (sendBtn) sendBtn.disabled = false;
          if (msgInput) {
            msgInput.disabled = false;
            msgInput.focus();
            msgInput.style.height = 'auto';
          }
          scrollToBottom();
        } else if (e.data.startsWith('[ERROR]')) {
          evtSource.close();
          if (cursor) cursor.remove();
          if (sendBtn) sendBtn.disabled = false;
          if (msgInput) msgInput.disabled = false;
          if (contentEl) {
            contentEl.textContent = e.data.replace('[ERROR] ', '');
            contentEl.classList.add('text-red-500');
          }
        } else {
          accumulated += e.data;
          if (contentEl) contentEl.textContent = accumulated;
          scrollToBottom();
        }
      };

      evtSource.onerror = function() {
        evtSource.close();
        if (cursor) cursor.remove();
        if (sendBtn) sendBtn.disabled = false;
        if (msgInput) msgInput.disabled = false;
      };
    }

    // Listen for HTMX swap on the messages container
    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'messages') {
        scrollToBottom();
        startStreaming();
        // Reset textarea
        const input = document.getElementById('msg-input');
        if (input) {
          input.value = '';
          input.style.height = 'auto';
        }
      }
    });

    // Scroll to bottom on initial load if there are messages
    document.addEventListener('DOMContentLoaded', function() {
      scrollToBottom();
    });
  </script>

</body>
</html>
