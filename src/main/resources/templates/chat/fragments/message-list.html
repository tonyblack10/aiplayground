<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="messageList">

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(messages) and !streaming}" class="flex-1 flex items-center justify-center h-full">
    <div class="text-center text-gray-400">
      <svg class="mx-auto mb-4 w-14 h-14 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <p class="text-base font-medium text-gray-500">Start a conversation</p>
      <p class="text-sm text-gray-400 mt-1">Configure your settings in the sidebar, then type a message below.</p>
    </div>
  </div>

  <!-- Message bubbles -->
  <th:block th:each="msg : ${messages}">

    <!-- User message -->
    <div th:if="${msg.role == 'user'}" class="flex justify-end mb-4">
      <div class="max-w-[75%]">
        <div class="bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm">
          <p class="text-sm leading-relaxed whitespace-pre-wrap break-words" th:text="${msg.content}">content</p>
        </div>
        <p class="text-xs text-gray-400 mt-1 text-right" th:text="${msg.timestamp}">time</p>
      </div>
    </div>

    <!-- Assistant message -->
    <div th:if="${msg.role == 'assistant'}" class="flex items-start gap-3 mb-4">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center flex-shrink-0 shadow-sm">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
      </div>
      <div class="max-w-[75%]">
        <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
          <p class="text-sm leading-relaxed text-gray-800 whitespace-pre-wrap break-words" th:text="${msg.content}">content</p>
        </div>
        <p class="text-xs text-gray-400 mt-1" th:text="${msg.timestamp}">time</p>
      </div>
    </div>

  </th:block>

  <!-- Streaming bubble (shown while AI is responding) -->
  <div th:if="${streaming}" id="streaming-bubble" class="flex items-start gap-3 mb-4">
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center flex-shrink-0 shadow-sm">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
      </svg>
    </div>
    <div class="max-w-[75%]">
      <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm min-w-[3rem]">
        <div class="text-xs text-gray-400 mb-1.5 font-medium" th:text="${settings?.model ?: 'AI'}">model</div>
        <p class="stream-content text-sm leading-relaxed text-gray-800 whitespace-pre-wrap break-words"></p>
        <span class="cursor inline-block w-2 h-4 bg-gray-400 rounded-sm animate-pulse align-text-bottom ml-0.5"></span>
      </div>
    </div>
  </div>

</th:block>

</body>
</html>
